package com.cinebook.controller;

import com.cinebook.entity.Booking;
import com.cinebook.entity.Movie;
import com.cinebook.repository.BookingRepository;
import com.cinebook.repository.MovieRepository;
import org.springframework.http.ResponseEntity;
import org.springframework.web.bind.annotation.*;

import java.util.HashMap;
import java.util.List;
import java.util.Map;
import java.util.Optional;

@RestController
@RequestMapping("/api/admin")
@CrossOrigin(origins = "*")
public class AdminController {
    private final MovieRepository movieRepository;
    private final BookingRepository bookingRepository;

    public AdminController(MovieRepository movieRepository, BookingRepository bookingRepository) {
        this.movieRepository = movieRepository;
        this.bookingRepository = bookingRepository;
    }

    @GetMapping("/dashboard")
    public Map<String, Long> getDashboardStats() {
        Map<String, Long> stats = new HashMap<>();
        stats.put("movies", movieRepository.count());
        stats.put("bookings", bookingRepository.count());
        return stats;
    }

    @GetMapping("/bookings")
    public List<Booking> getBookings() {
        return bookingRepository.findAll();
    }

    @PostMapping("/movies")
    public Movie addMovie(@RequestBody Movie movie) {
        return movieRepository.save(movie);
    }

    @PutMapping("/movies/{id}")
    public ResponseEntity<Movie> updateMovie(@PathVariable Long id, @RequestBody Movie updatedMovie) {
        Optional<Movie> existing = movieRepository.findById(id);
        if (existing.isEmpty()) {
            return ResponseEntity.notFound().build();
        }

        Movie movie = existing.get();
        movie.setTitle(updatedMovie.getTitle());
        movie.setDescription(updatedMovie.getDescription());
        movie.setDuration(updatedMovie.getDuration());
        movie.setGenre(updatedMovie.getGenre());
        movie.setLanguage(updatedMovie.getLanguage());
        movie.setReleaseDate(updatedMovie.getReleaseDate());
        movie.setRating(updatedMovie.getRating());
        movie.setPosterUrl(updatedMovie.getPosterUrl());
        movie.setBannerUrl(updatedMovie.getBannerUrl());
        movie.setStatus(updatedMovie.getStatus());
        movie.setFeatured(updatedMovie.getFeatured());

        return ResponseEntity.ok(movieRepository.save(movie));
    }

    @DeleteMapping("/movies/{id}")
    public ResponseEntity<Void> deleteMovie(@PathVariable Long id) {
        if (movieRepository.existsById(id)) {
            movieRepository.deleteById(id);
            return ResponseEntity.noContent().build();
        }
        return ResponseEntity.notFound().build();
    }
}
